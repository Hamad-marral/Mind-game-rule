<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Game Rules</title>
<style>
:root{--bg:#0f3d2e;--felt:#1a6048;--card:#fffdf7;--ink:#1d1d1f;--red:#c8102e;--gold:#f2c14e;--navy:#243a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2a20;--felt:#134635}}
:root[data-theme="dark"]{--bg:#0b2a20;--felt:#134635}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 50% 0,var(--felt),var(--bg) 75%);background-attachment:fixed;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:26px 16px 8px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:2.4rem;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.35)}
header p{margin:6px 0 0;opacity:.85}
main{max-width:560px;margin:0 auto;padding:12px 14px 36px;display:grid;gap:14px}
.rule{background:var(--card);color:var(--ink);border-radius:16px;padding:12px;box-shadow:0 4px 0 rgba(0,0,0,.3);display:grid;grid-template-columns:62px 1fr;gap:6px 14px;align-items:center}
.face{grid-row:span 2;height:86px;border:2px solid var(--red);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:Georgia,serif;font-weight:bold;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px rgba(200,16,46,.25)}
.face b{font-size:1.9rem;line-height:1}.face i{font-style:normal;font-size:1.6rem}
.rule p{margin:0;font-size:1rem;line-height:1.4;font-weight:600}
.viz{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:#eef5f1;border-radius:10px;padding:8px 6px}
.grp{display:flex;flex-direction:column;align-items:center;gap:3px}
.grp small{font-size:.68rem;color:#4b5d55;font-weight:700}
.row{display:flex;gap:3px}
.mc{width:20px;height:28px;border-radius:4px;border:1.5px solid #fff;background:repeating-linear-gradient(45deg,var(--navy),var(--navy) 3px,#31508f 3px,#31508f 6px);box-shadow:0 1px 2px rgba(0,0,0,.35);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
.me .mc{background:var(--gold);border-color:#b8892a;color:#5a3d00}
.num .mc{background:#fff;border-color:var(--red);color:var(--red)}
.arr{font-size:1.4rem;color:var(--red);font-weight:bold}
.eye{font-size:1.6rem}
@media(max-width:360px){.rule{grid-template-columns:52px 1fr}.face{height:74px}}
footer{text-align:center;opacity:.7;font-size:.85rem;padding:0 16px 24px}
</style>
</head>
<body>
<header><h1>Mind Game</h1><p>Special card rules</p></header>
<main id="m"></main>
<footer>Good luck, and keep your poker face!</footer>
<script>
const c=(n,cls='',txt)=>`<div class="row ${cls}">${Array.from({length:n},(_,i)=>`<div class="mc">${txt?txt[i]:''}</div>`).join('')}</div>`;
const g=(n,l,cls,txt)=>`<div class="grp ${cls||''}">${c(n,'',txt)}<small>${l}</small></div>`;
const sw=(a,la,b,lb,ca,cb)=>g(a,la,ca)+`<span class="arr">⇄</span>`+g(b,lb,cb);
const R=[
['6','Exchange your all cards [one card per person] with any three persons',
 g(3,'Your 3 cards','me')+`<span class="arr">⇄</span>`+['P1','P2','P3'].map(p=>g(1,p)).join(' ')],
['7','Exchange your three cards with any person\'s three cards',sw(3,'You',3,'Any person','me')],
['8','Exchange any person\'s three cards with other\'s three cards',sw(3,'Person A',3,'Person B')],
['9','Exchange any person\'s two cards with other\'s two cards',sw(2,'Person A',2,'Person B')],
['10','You can see your own cards',`<span class="eye">👁</span>`+g(3,'Your cards','me')],
['A','Exchange any person\'s one card with other\'s one card',sw(1,'Person A',1,'Person B')],
['J','Change the order of any person\'s three cards',g(3,'Before','num',[1,2,3])+`<span class="arr">🔀</span>`+g(3,'After','num',[3,1,2])],
['Q','Exchange your two cards with any person\'s two cards',sw(2,'You',2,'Any person','me')],
['K','Mix any person\'s three cards in deck and give him new three cards',g(3,'Their cards','num',[1,2,3])+`<span class="arr">→ 🂠 →</span>`+g(3,'New cards','num',['?','?','?'])]
];
document.getElementById('m').innerHTML=R.map(r=>`<div class="rule"><div class="face"><b>${r[0]}</b><i>♦</i></div><p>${r[1]}</p><div class="viz">${r[2]}</div></div>`).join('');
</script>
</body>
</html>
